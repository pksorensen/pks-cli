name: 'Expo Login'
description: >
  Export EXPO_TOKEN into the job environment using pks runner credentials
  (requires 'pks expo init' on the runner host and the repo registered with
  'pks github runner register --repo owner/repo --expo').

runs:
  using: composite
  steps:
    - name: Fetch Expo token via pks runner credentials
      shell: bash
      run: |
        SOCKET="${PKS_TOKEN_URL:-/var/run/pks-creds/creds.sock}"

        diag() {
          echo "::group::pks credential socket diagnostics"
          echo "socket path     : $SOCKET"
          echo "PKS_TOKEN set   : $([ -n "${PKS_TOKEN:-}" ] && echo yes || echo no)"
          echo "PKS_TOKEN_URL   : ${PKS_TOKEN_URL:-<unset, using default>}"
          echo "uid/gid         : $(id 2>/dev/null || echo unknown)"
          if [ -S "$SOCKET" ]; then
            echo "socket          : present"
            ls -la "$SOCKET" 2>/dev/null || true
          elif [ -e "$SOCKET" ]; then
            echo "socket          : path exists but is not a socket"
            ls -la "$SOCKET" 2>/dev/null || true
          else
            echo "socket          : missing"
            SOCKET_DIR="$(dirname "$SOCKET")"
            if [ -d "$SOCKET_DIR" ]; then
              echo "socket dir      : exists ($SOCKET_DIR)"
              ls -la "$SOCKET_DIR" 2>/dev/null || true
            else
              echo "socket dir      : missing ($SOCKET_DIR)"
            fi
          fi
          # Mount-layer diagnostics: tells us whether /var/run/pks-creds is a real bind mount,
          # whether something is shadowing /var/run (e.g. dind tmpfs), or whether the mount was
          # never applied at all.
          SOCKET_DIR="$(dirname "$SOCKET")"
          echo "--- mount layer ---"
          echo "findmnt $SOCKET_DIR :"
          findmnt "$SOCKET_DIR" 2>&1 || echo "  (not a mountpoint)"
          echo "findmnt /var/run :"
          findmnt /var/run 2>&1 || echo "  (not a mountpoint)"
          echo "/proc/self/mountinfo (var/run | pks-creds) :"
          grep -E "var/run|pks-creds" /proc/self/mountinfo 2>/dev/null || echo "  (no matching entries)"
          echo "::endgroup::"
        }

        # Pre-flight: socket must exist and PKS_TOKEN must be set.
        if [ ! -S "$SOCKET" ]; then
          echo "::error::pks credential socket not found at $SOCKET"
          diag
          echo "Hint: the runner bind-mounts the socket into the devcontainer at /var/run/pks-creds."
          echo "Jobs using 'container:', 'services:', or that run this step inside another"
          echo "docker container do NOT inherit that mount. Run expo-login in the runner"
          echo "job (no 'container:' key) before any containerized steps."
          exit 1
        fi
        if [ -z "${PKS_TOKEN:-}" ]; then
          echo "::error::PKS_TOKEN is not set in this step's environment."
          diag
          echo "Hint: the runner injects PKS_TOKEN into the job environment. If it's missing,"
          echo "the step may be running outside the runner's container (see hint above)."
          exit 1
        fi

        # Capture curl exit code separately from HTTP status so we can distinguish
        # connection failures (exit 7) from server-side errors.
        CURL_BODY="$(mktemp)"
        trap 'rm -f "$CURL_BODY"' EXIT

        set +e
        HTTP_CODE=$(curl -sS -o "$CURL_BODY" -w "%{http_code}" --unix-socket "$SOCKET" \
          -H "Authorization: Bearer $PKS_TOKEN" \
          "http://localhost/expo/token" 2>&1)
        CURL_EXIT=$?
        set -e

        if [ "$CURL_EXIT" -ne 0 ]; then
          echo "::error::curl failed to query pks credential socket (exit $CURL_EXIT)"
          case "$CURL_EXIT" in
            7)  echo "  -> connection refused / socket not reachable" ;;
            22) echo "  -> HTTP error returned" ;;
            28) echo "  -> request timed out" ;;
          esac
          if [ -n "$HTTP_CODE" ]; then echo "  curl stderr: $HTTP_CODE"; fi
          diag
          exit "$CURL_EXIT"
        fi

        RESPONSE="$(cat "$CURL_BODY")"

        if [ "$HTTP_CODE" -ne 200 ]; then
          echo "::error::Expo token request failed (HTTP $HTTP_CODE): $RESPONSE"
          case "$HTTP_CODE" in
            401) echo "Hint: PKS_TOKEN is invalid or expired for this job." ;;
            403) echo "Hint: ${GITHUB_REPOSITORY:-this repository} is not approved for Expo access." ;;
            404) echo "Hint: no Expo token stored on the runner. Run 'pks expo init' on the runner host." ;;
            503) echo "Hint: the runner is older than this action, or was started without Expo support." ;;
          esac
          if [ "$HTTP_CODE" = "403" ]; then
            echo "      Approve it on the runner host with:"
            echo "        pks github runner register --repo ${GITHUB_REPOSITORY:-owner/repo} --expo"
          fi
          exit 1
        fi

        TOKEN=$(echo "$RESPONSE" | jq -r '.token')
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "::error::credential response missing token"
          exit 1
        fi

        # Mask before export: everything after this point may echo the environment.
        echo "::add-mask::$TOKEN"
        echo "EXPO_TOKEN=$TOKEN" >> "$GITHUB_ENV"

        echo "Expo token acquired; EXPO_TOKEN exported for later steps in this job."
